seed: 42
data:
  csv: data/synthetic/frames.csv
  image_root: data/synthetic/images
  image_size: 64
  telemetry_columns: [nozzle_temperature, bed_temperature, extrusion_rate, layer_height]
model:
  name: tiny_vit_fusion
  num_classes: 2
  patch_size: 16
  embed_dim: 32
  depth: 1
  num_heads: 4
  dropout: 0.1
  telemetry_dim: 4
train:
  epochs: 1
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  output_dir: runs/printvision_smoke
