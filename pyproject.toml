[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-modal-temporal-emotion"
version = "0.1.0"
description = "MMTED multimodal temporal emotion project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10,<1.14",
  "scikit-learn>=1.3,<1.6",
  "torch>=2.2",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
